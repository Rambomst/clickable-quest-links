name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      databases:
        description: The quest database releases the "real" scenarios read, pinned or latest (see tests/run.sh).
        type: string
        default: pinned
      filter:
        description: Only the scenarios whose names contain this; empty runs them all.
        type: string
        default: ""

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends luajit
      # forever_sim at the cjber/forever-core commit tests/forever_sim.txt pins, with the Blizzard UI source and client
      # tables it runs against, which are fetched at test time and never committed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/questlinks-sim/forever-core
            ~/.cache/questlinks-sim/sim
          key: forever-sim-${{ hashFiles('tests/forever_sim.txt') }}
      - name: Fetch forever_sim
        run: tests/sim.sh
      # The released quest databases the scenarios read. tests/run.sh fetches any that are missing and checks their
      # SHA-256, and pins them, so its hash keys the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/questlinks-sim/addons
          key: questlinks-addons-${{ hashFiles('tests/run.sh') }}
      - name: Run the tests
        env:
          QUESTLINKS_DATABASES: ${{ inputs.databases || 'pinned' }}
          FILTER: ${{ inputs.filter }}
          # For gh, which finds the newest releases when the databases are "latest".
          GH_TOKEN: ${{ github.token }}
        run: tests/run.sh ${FILTER:+"$FILTER"}
